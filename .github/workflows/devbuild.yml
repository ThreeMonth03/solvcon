name: devbuild

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  # nightly_devbuild.yml calls this workflow on the cron so the ubuntu and
  # macOS build runs at night, without a second copy of the steps. The call
  # takes no input: inside a called workflow the github context is the
  # caller's, so the job gates below read the caller's event name.
  workflow_call:

concurrency:
  # Key each master push on its commit SHA so every merge lands in its own
  # concurrency group. Sharing one group serializes master runs, and with
  # cancel-in-progress disabled GitHub still cancels a pending run when the
  # next merge queues behind the one in progress, so a later merge would
  # drop an earlier merge's result. A unique group per SHA keeps every
  # master run independent. Pull requests key on the PR number and other
  # branches on the ref, so their superseded runs still cancel.
  #
  # Name this workflow directly, not through github.workflow. Under a
  # workflow_call that holds the caller's name, so the devbuild and lint calls
  # would share one group. A nightly call keys on the workflow rather than the
  # commit: its github.ref and github.sha are master's, so a nightly that
  # starts while the master push run is still in flight would queue behind it.
  # Ref: https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
  group: devbuild-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  check_skip:
    uses: ./.github/workflows/check_skip_ci.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read

  standalone_buffer:

    needs: [check_skip]

    if: |
      needs.check_skip.outputs.skip != 'true' &&
      github.repository == 'ThreeMonth03/solvcon' &&
      github.ref == 'refs/heads/codex/pilot-ci-wrapper-lifetime'

    name: standalone_buffer_${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: ${{ fromJSON(vars.SCGH_TIMEOUT_STANDALONE_BUFFER || vars.MMGH_TIMEOUT_STANDALONE_BUFFER || '10') }}

    env:
      # The build type names this job's scratch directory and its cache key.
      CMAKE_BUILD_TYPE: ${{ matrix.cmake_build_type }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        cmake_build_type: [Release]

      fail-fast: false

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: event name
        run: |
          echo "github.event_name: ${{ github.event_name }}"

      - name: setup dependencies
        uses: ./.github/actions/setup_linux
        with:
          workflow: 'standalone_buffer'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-standalone-buffer-${{ matrix.cmake_build_type }}
          restore-keys: ${{ runner.os }}-standalone-buffer-${{ matrix.cmake_build_type }}
          # contrib/standalone_buffer/Makefile compiles with a bare `c++`
          # outside CMake, so the symlinks are this job's only route to ccache.
          create-symlink: true
          save: ${{ github.event_name != 'pull_request' }}
          # Bound the cache so it does not grow without limit across the rolling
          # key. A master push saves this cache; pull requests restore it (a PR
          # on a non-default base branch cannot, so it runs cold).
          max-size: 500M

      - name: make standalone_buffer
        run: |
          echo "::group::make standalone_buffer"
          make standalone_buffer_setup
          make standalone_buffer
          echo "::endgroup::"

  build:

    # Gate the heavy build behind the fast standalone_buffer smoke compile so
    # a broken build short-circuits before the full matrix launches.
    needs: [check_skip, standalone_buffer]

    if: |
      needs.check_skip.outputs.skip != 'true' &&
      github.repository == 'ThreeMonth03/solvcon' &&
      github.ref == 'refs/heads/codex/pilot-ci-wrapper-lifetime'

    name: native_${{ matrix.batch }}_${{ matrix.os }}_${{ matrix.cmake_build_type }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 90

    env:
      # A matrix entry naming no parallelism must fall back here rather than
      # reach the Makefile empty: `MAKE_PARALLEL ?=` tests whether the
      # variable is set, not whether it holds anything.
      MAKE_PARALLEL: ${{ matrix.make_parallel || '-j2' }}
      # Every step in this job builds one build type, and the Makefile derives
      # the build tree from it. Setting it here rather than per step keeps a
      # bare `make buildext` on the tree the preceding `make cmake`
      # configured; naming it in only some of them splits the job across two
      # trees, and the second one configures from the preset defaults.
      CMAKE_BUILD_TYPE: ${{ matrix.cmake_build_type }}
      BUILD_METAL: ${{ matrix.build_metal }}
      QT_DEBUG_PLUGINS: 1
      # QT_QPA_PLATFORM is set per-OS by the setup actions (xcb on Linux via
      # Xvfb, cocoa on macOS). Do not set it at the job level.
      PIP_BREAK_SYSTEM_PACKAGES: 1 # disabling PEP668 (for MacOS runner)
      # Fix issue: https://github.com/solvcon/solvcon/issues/366
      # Use custom config for jurplel/install-qt-action@v4
      AQT_CONFIG: "thirdparty/aqt_settings.ini"

    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: 1
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 2
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 3
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 4
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 5
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 6
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 7
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4
          - batch: 8
            os: ubuntu-24.04
            cmake_build_type: Release
            build_metal: OFF
            make_parallel: -j4

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: event name
      run: |
        echo "github.event_name: ${{ github.event_name }}"

    - name: setup dependencies for Linux
      if: runner.os == 'Linux'
      uses: ./.github/actions/setup_linux
      with:
        workflow: 'build'

    - name: Set up native crash debugger
      if: runner.os == 'Linux'
      run: |
        if ! command -v gdb >/dev/null 2>&1 ; then
          sudo apt-get -qy install --no-install-recommends gdb
        fi
        gdb --version

    - name: Verify native core capture
      env:
        CRASH_DIR: ${{ runner.temp }}/pilot-1611-native
      run: |
        mkdir -p "$CRASH_DIR"
        echo "CRASH_DIR=$CRASH_DIR" >> "$GITHUB_ENV"
        sudo sysctl -w "kernel.core_pattern=$CRASH_DIR/core.%e.%p.%t"
        ulimit -c unlimited
        {
          git rev-parse HEAD
          uname -a
          lscpu
          python3 --version
          g++ --version
          python3 -m pip freeze
          cat /proc/sys/kernel/core_pattern
          cat /proc/sys/kernel/randomize_va_space
          df -h "$CRASH_DIR"
        } > "$CRASH_DIR/environment.txt"
        python3 contrib/ci/collect-1611-core.py preflight "$CRASH_DIR"

    - name: setup dependencies for macOS
      if: runner.os == 'macOS'
      uses: ./.github/actions/setup_macos
      with:
        workflow: 'build'

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }}-${{ matrix.cmake_build_type }}
        restore-keys: ${{ runner.os }}-${{ matrix.cmake_build_type }}
        save: ${{ github.event_name != 'pull_request' }}
        # Bound the cache so it does not grow without limit across the rolling
        # key. A master push saves this cache; pull requests restore it (a PR
        # on a non-default base branch cannot, so it runs cold).
        max-size: 1500M

    - name: make gtest BUILD_QT=OFF
      run: |
        echo "::group::make gtest BUILD_QT=OFF"
        make gtest \
          VERBOSE=1 USE_CLANG_TIDY=OFF \
          BUILD_QT=OFF
        echo "::endgroup::"

    - name: make buildext BUILD_QT=OFF
      run: |
        echo "::group::make buildext BUILD_QT=OFF"
        rm -f build/*/Makefile
        make cmake \
          VERBOSE=1 USE_CLANG_TIDY=OFF \
          BUILD_QT=OFF \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3)"
        make buildext VERBOSE=1
        echo "::endgroup::"

    - name: make pytest BUILD_QT=OFF
      run: |
        echo "::group::make pytest BUILD_QT=OFF"
        python3 -c "import solvcon; assert solvcon.HAS_PILOT == False"
        JOB_MAKE_ARGS="${JOB_MAKE_ARGS} VERBOSE=1"
        make pytest ${JOB_MAKE_ARGS}
        echo "::endgroup::"

    - name: make buildext BUILD_QT=ON
      run: |
        echo "::group::make buildext BUILD_QT=ON"
        rm -f build/*/Makefile
        make cmake \
          VERBOSE=1 USE_CLANG_TIDY=OFF \
          BUILD_QT=ON \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3)"
        make buildext VERBOSE=1
        echo "::endgroup::"

    - name: Compare layout wrapper lifetime
      run: |
        ulimit -c 0
        python3 contrib/ci/reproduce-1611-layout.py compare \
          2>&1 | tee "$CRASH_DIR/layout-lifetime.log"

    - name: make pytest BUILD_QT=ON
      run: |
        echo "::group::make pytest BUILD_QT=ON"
        python3 -c "import solvcon; assert solvcon.HAS_PILOT == True"
        JOB_MAKE_ARGS="${JOB_MAKE_ARGS} VERBOSE=1"
        if [ "${{ matrix.os }}" == "macos-26" ] ; then \
          # PySide6 installed by pip will bundle with a prebuilt Qt,
          # this will cause duplicated symbol.
          # Solve this issue by removed PySide6 prebuilt Qt library
          PYSIDE6_PATH=$(python3 -c "import sys, os, PySide6; sys.stdout.write(os.path.dirname(PySide6.__file__))")
          echo "pyside6 path: ${PYSIDE6_PATH}"
          rm -rf ${PYSIDE6_PATH}/Qt/lib/*.framework
          # maunally add homebrew's Qt rpath to PySide6
          install_name_tool -add_rpath $(qtpaths --install-prefix)/lib ${PYSIDE6_PATH}/QtWidgets.abi3.so
          install_name_tool -add_rpath $(qtpaths --install-prefix)/lib ${PYSIDE6_PATH}/QtGui.abi3.so
          install_name_tool -add_rpath $(qtpaths --install-prefix)/lib ${PYSIDE6_PATH}/QtCore.abi3.so
        fi
        ulimit -c unlimited
        for attempt in $(seq 1 20) ; do
          echo "Qt native test attempt ${attempt}/20"
          date -u +%FT%TZ > "$CRASH_DIR/attempt-${attempt}.started"
          set +e
          make pytest ${JOB_MAKE_ARGS} \
            2>&1 | tee "$CRASH_DIR/attempt-${attempt}.log"
          status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\t%s\t%s\n' "$attempt" "${status[0]}" "${status[1]}" \
            >> "$CRASH_DIR/attempts.tsv"
          if [ "${status[0]}" -ne 0 ] ; then exit "${status[0]}" ; fi
          if [ "${status[1]}" -ne 0 ] ; then exit "${status[1]}" ; fi
        done
        echo "::endgroup::"

    - name: Collect native crash evidence
      if: always()
      env:
        CRASH_DIR: ${{ runner.temp }}/pilot-1611-native
      run: |
        cp /tmp/xvfb.log "$CRASH_DIR/" || true
        python3 contrib/ci/collect-1611-core.py collect "$CRASH_DIR"

    - name: Preserve native crash evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pilot-1611-native-${{ matrix.batch }}
        path: ${{ runner.temp }}/pilot-1611-native/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 1

    - name: make pilot
      run: |
        echo "::group::make pilot"
        rm -f build/*/Makefile
        make pilot \
          VERBOSE=1 USE_CLANG_TIDY=OFF \
          BUILD_QT=ON \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3)"
        echo "::endgroup::"

    - name: make run_pilot_pytest
      run: |
        echo "::group::make run_pilot_pytest"
        export LD_LIBRARY_PATH=$(python3 -c "import sys, os, shiboken6; sys.stdout.write(os.path.dirname(shiboken6.__file__))")
        # A runner has no desktop to take over, so let this job map its windows
        # and keep the tests that need a live surface out of the skips.
        export SOLVCON_TEST_SHOW_WINDOWS=ON
        make run_pilot_pytest VERBOSE=1
        echo "::endgroup::"

  build_cuda:

    needs: [check_skip, standalone_buffer]

    if: |
      needs.check_skip.outputs.skip != 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       ((vars.SCGH_PUSH_RUN_BRANCH || vars.MMGH_PUSH_RUN_BRANCH) == '*' ||
        contains(vars.SCGH_PUSH_RUN_BRANCH || vars.MMGH_PUSH_RUN_BRANCH, github.ref_name))))

    name: build_cuda_ubuntu-24.04

    runs-on: ubuntu-24.04

    timeout-minutes: ${{ fromJSON(vars.SCGH_TIMEOUT_BUILD || vars.MMGH_TIMEOUT_BUILD || '45') }}

    env:
      MAKE_PARALLEL: -j4
      CMAKE_BUILD_TYPE: Release
      PIP_BREAK_SYSTEM_PACKAGES: 1

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: event name
      run: |
        echo "github.event_name: ${{ github.event_name }}"

    - name: setup dependencies for Linux
      uses: ./.github/actions/setup_linux
      with:
        workflow: 'build_cuda'

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }}-cuda-Release
        restore-keys: ${{ runner.os }}-cuda-Release
        save: ${{ github.event_name != 'pull_request' }}
        max-size: 1500M

    - name: make buildext BUILD_CUDA=ON
      run: |
        echo "::group::make buildext BUILD_CUDA=ON"
        nvcc --version
        make buildext \
          VERBOSE=1 USE_CLANG_TIDY=OFF \
          BUILD_QT=OFF BUILD_CUDA=ON \
          CMAKE_CUDA_ARCHITECTURES=all-major \
          CMAKE_CUDA_HOST_COMPILER=g++-14
        echo "::endgroup::"

  send_email_on_failure:
    needs: [check_skip, standalone_buffer, build, build_cuda]
    # Mail a master push failure only. A nightly call reads the caller's
    # event name, and nightly_devbuild mails that one itself. A
    # `timeout-minutes` kill reports `cancelled`, not `failure`.
    if: |
      always() &&
      (contains(needs.*.result, 'failure') ||
       contains(needs.*.result, 'cancelled')) &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    uses: ./.github/workflows/send_email_on_fail.yml
    with:
      job_results: |
        - check_skip: ${{ needs.check_skip.result }}
        - standalone_buffer: ${{ needs.standalone_buffer.result }}
        - build: ${{ needs.build.result }}
        - build_cuda: ${{ needs.build_cuda.result }}
    secrets:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

  open_issue_on_failure:
    needs: [check_skip, standalone_buffer, build, build_cuda]
    # Report a master push failure only, on the same gate as
    # send_email_on_failure above.
    if: |
      always() &&
      (contains(needs.*.result, 'failure') ||
       contains(needs.*.result, 'cancelled')) &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    permissions:
      issues: write
      pull-requests: read
    uses: ./.github/workflows/open_issue_on_failure.yml
    with:
      job_results: |
        - check_skip: ${{ needs.check_skip.result }}
        - standalone_buffer: ${{ needs.standalone_buffer.result }}
        - build: ${{ needs.build.result }}
        - build_cuda: ${{ needs.build_cuda.result }}
